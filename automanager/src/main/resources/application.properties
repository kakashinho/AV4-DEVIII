# H2 em memória
spring.datasource.url=jdbc:h2:mem:automanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Debug SQL (opcional mas recomendado)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Console H2 — em produção, definir H2_CONSOLE_ENABLED=false via variável de ambiente
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT — em produção, definir JWT_SECRET via variável de ambiente
jwt.secret=${JWT_SECRET:automanager-toyota-jwt-secret-key-seguranca-2024-256bits-min}
jwt.expiration=86400000